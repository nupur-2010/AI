[project]
name = "learnlangchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nupur Maheshwari", email = "nupur.maheshwari.2010@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "python-dotenv>=1.2.3",
]

[project.scripts]
learnlangchain = "learnlangchain:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
